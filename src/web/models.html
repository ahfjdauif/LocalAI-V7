<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地AI · 模型中心</title>
<style>
  :root{--brand:#2563eb;--ink:#1f2937;--muted:#6b7280;--line:#e6ebf3}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);
    background:radial-gradient(1100px 460px at 8% -8%,#e8f1ff 0%,transparent 62%),#f4f7fc;
    min-height:100vh;padding:22px 26px 40px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .brand{position:relative;width:38px;height:38px;border-radius:12px;overflow:hidden;
    background:linear-gradient(140deg,#60a5fa,#2563eb);display:grid;place-items:center;color:#fff;
    font-weight:800;font-size:15px;box-shadow:0 6px 16px rgba(37,99,235,.3)}
  .brand img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  h1{font-size:20px;font-weight:700}
  .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .spacer{flex:1}
  .btn{border:1px solid #dbe3ee;background:#fff;color:#2c3e8f;border-radius:10px;
    padding:8px 16px;font-size:13px;font-family:inherit;cursor:pointer;transition:.16s}
  .btn:hover{background:#eef3ff;border-color:#c6d8ff}
  .btn.primary{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:none;
    box-shadow:0 6px 16px rgba(37,99,235,.25)}
  .btn.primary:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .meta{font-size:12px;color:var(--muted);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;
    box-shadow:0 6px 18px rgba(15,23,42,.05);display:flex;flex-direction:column;gap:8px}
  .card.on{border-color:#93b4ff;box-shadow:0 10px 26px rgba(37,99,235,.14)}
  .card .top{display:flex;align-items:center;gap:8px}
  .card .name{font-size:15px;font-weight:700}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef4ff;color:#1d4ed8;
    border:1px solid #d6e4ff}
  .card .use{font-size:12.5px;color:#41506b;line-height:1.7}
  .card .rows{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .card .rows b{color:#374151}
  .card .foot{display:flex;align-items:center;gap:10px;margin-top:4px}
  .state{font-size:12px;padding:3px 10px;border-radius:999px}
  .state.ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
  .progress{display:none;margin-bottom:16px;background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:14px 18px;box-shadow:0 8px 22px rgba(15,23,42,.06)}
  .progress.show{display:block}
  .bar{height:8px;background:#eef2f7;border-radius:999px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2563eb,#0ea5e9);
    border-radius:999px;transition:width .3s ease}
  .prow{display:flex;align-items:baseline;gap:12px;font-size:13px}
  .prow .pct{font-size:18px;font-weight:700;color:#1d4ed8}
  .pmeta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:16px;flex-wrap:wrap}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(10px);
    background:#111c30;color:#e8efff;padding:10px 18px;border-radius:12px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .warn{font-size:12px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;
    border-radius:10px;padding:8px 12px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<header>
  <div class="brand"><span>AI</span><img src="app.ico" alt="" onerror="this.remove()"></div>
  <div>
    <h1>模型中心</h1>
    <div class="sub">内置通义千问全家族，联网自动校对文件大小与校验值</div>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btnRefresh">🔄 联网刷新</button>
  <button class="btn" id="btnChat">返回聊天</button>
</header>
<div class="warn" id="warn"></div>
<div class="progress" id="prog">
  <div class="prow"><span class="pct" id="pct">0%</span><span id="msg">准备中…</span></div>
  <div class="bar"><i id="barIn"></i></div>
  <div class="pmeta">
    <span>已下载 <b id="dl">0 B</b> / <b id="tt">0 B</b></span>
    <span>速度 <b id="sp">0 B/s</b></span>
    <span id="err" style="color:#b91c1c"></span>
  </div>
</div>
<div class="meta" id="meta">正在读取模型清单…</div>
<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id);
let catalog = null;
let busy = false, pollTimer = null;

function human(n) {
  if (!n) return '0 B';
  const u = ['B','KB','MB','GB']; let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toFixed(v >= 100 ? 0 : 1) + ' ' + u[i];
}
function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2400);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

async function load() {
  try {
    catalog = await (await fetch('/api/catalog', { cache: 'no-store' })).json();
  } catch (e) {
    $('meta').textContent = '读取失败：' + e.message;
    return;
  }
  const status = catalog.online
    ? ('已联网校验 · ' + (catalog.checked_at || ''))
    : '离线：显示内置清单（联网后可点「联网刷新」校对大小）';
  $('meta').textContent = status + '　共 ' + catalog.models.length + ' 个模型';
  const warn = $('warn');
  if (catalog.online && catalog.error) {
    warn.style.display = 'block';
    warn.textContent = '部分模型校验失败：' + catalog.error;
  } else { warn.style.display = 'none'; }

  const g = $('grid'); g.innerHTML = '';
  catalog.models.forEach(m => {
    const c = document.createElement('div');
    c.className = 'card' + (m.installed ? ' on' : '');
    c.innerHTML =
      '<div class="top"><span class="name">' + esc(m.label) + '</span>' +
        m.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' +
      '<div class="use">用途：' + esc(m.use) + '</div>' +
      '<div class="rows"><span>体积 <b>' + human(m.size) + '</b></span>' +
        '<span>建议内存 <b>' + esc(m.ram) + '</b></span>' +
        '<span>精度 <b>Q4_K_M</b></span></div>' +
      '<div class="foot"></div>';
    const foot = c.querySelector('.foot');
    if (m.installed) {
      const st = document.createElement('span');
      st.className = 'state ok'; st.textContent = '已安装';
      foot.appendChild(st);
      const b = document.createElement('button');
      b.className = 'btn'; b.textContent = '去聊天使用';
      b.onclick = () => location.href = '/chat.html';
      foot.appendChild(b);
    } else {
      const b = document.createElement('button');
      b.className = 'btn primary'; b.textContent = '一键安装';
      b.onclick = () => install(m.key, m.label);
      foot.appendChild(b);
      const st = document.createElement('span');
      st.className = 'state'; st.textContent = '未安装';
      foot.appendChild(st);
    }
    g.appendChild(c);
  });
}

async function install(key, label) {
  if (busy) { toast('正在安装其它模型，请稍候'); return; }
  if (!confirm('开始安装「' + label + '」？\n下载与注册期间请保持联网，不要关闭窗口。')) return;
  busy = true;
  $('prog').classList.add('show');
  $('pct').textContent = '0%'; $('msg').textContent = '正在启动安装…';
  $('barIn').style.width = '0%'; $('err').textContent = '';
  try {
    const r = await fetch('/api/setup/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: key })
    });
    const j = await r.json();
    if (!r.ok || !j.ok) {
      toast('启动失败：' + (j.error || r.status));
      busy = false; return;
    }
  } catch (e) {
    toast('启动失败：' + e.message); busy = false; return;
  }
  pollTimer = setInterval(poll, 800);
}

async function poll() {
  try {
    const st = await (await fetch('/api/setup/status', { cache: 'no-store' })).json();
    $('pct').textContent = (st.percent || 0) + '%';
    $('barIn').style.width = (st.percent || 0) + '%';
    $('msg').textContent = st.message || '';
    $('dl').textContent = human(st.downloaded);
    $('tt').textContent = human(st.total);
    $('sp').textContent = human(st.speed) + '/s';
    $('err').textContent = st.error || '';
    if (st.stage === 'done') {
      clearInterval(pollTimer); busy = false;
      toast('安装完成，可以回聊天页使用了');
      setTimeout(load, 600);
    } else if (st.stage === 'error') {
      clearInterval(pollTimer); busy = false;
      toast('安装失败：' + (st.error || '未知原因'));
      setTimeout(load, 600);
    }
  } catch (e) {}
}

$('btnRefresh').onclick = async () => {
  const b = $('btnRefresh'); b.disabled = true; b.textContent = '正在联网…';
  try {
    catalog = await (await fetch('/api/catalog/refresh', { method: 'POST' })).json();
    toast(catalog.online ? '校验完成' : '联网失败，继续使用内置清单');
    await load();
  } catch (e) { toast('刷新失败：' + e.message); }
  b.disabled = false; b.textContent = '🔄 联网刷新';
};
$('btnChat').onclick = () => location.href = '/chat.html';

load();
// 有安装任务在跑时，进页面直接接上进度
(async () => {
  try {
    const st = await (await fetch('/api/setup/status', { cache: 'no-store' })).json();
    if (st.busy) {
      busy = true; $('prog').classList.add('show');
      pollTimer = setInterval(poll, 800);
    }
  } catch (e) {}
})();
</script>
</body>
</html>
